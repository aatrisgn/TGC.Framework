name: tgc-emulators

services:
  cosmos:
    container_name: "cosmos-emulator"
    image: "mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest"
    pull_policy: always
    command: ["--protocol", "https"]
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1234:1234"
    volumes:
      - "./.dataTemp/cosmos:/dataTemp"

  # Service Bus uses standard AMQP on port 5672, bound to 127.0.0.1.
  # See README.md for why Event Hubs below is bound to a different loopback IP (127.0.0.2) instead.
  servicebus:
    container_name: "servicebus-emulator"
    image: "mcr.microsoft.com/azure-messaging/servicebus-emulator:latest"
    pull_policy: always
    volumes:
      - "./config/servicebus.Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - mssql
    networks:
      sb-emulator:
        aliases:
          - "servicebus-emulator"

  # mcr.microsoft.com/azure-sql-edge (amd64+arm64) is what the Docker-Compose-Template in
  # the Service Bus emulator's own installer repo defaults to, but its ARM64 build reliably
  # crashes with SIGABRT on Apple Silicon (confirmed on an M3 Pro, across both the "latest"
  # and 1.0.7 tags — a real Azure SQL Edge compatibility bug, not a config issue here).
  # mssql/server:2022-latest is amd64-only, so it runs under Docker Desktop's Rosetta
  # emulation on Apple Silicon, but that's stable where native SQL Edge is not — and it's
  # what Microsoft's own "test locally with Service Bus emulator" doc uses in its compose
  # sample, rather than the installer repo's default.
  mssql:
    container_name: "mssql"
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    networks:
      sb-emulator:
        aliases:
          - "mssql"

  # AMQP bound to 127.0.0.2 (not 127.0.0.1) so it doesn't collide with the Service Bus
  # emulator above on port 5672 — both SDKs hardcode 5672 regardless of the port in the
  # connection string, so a distinct loopback IP is the only way to run both at once.
  # Run the matching scripts/*-setup-loopback-alias.* script for your OS once before
  # starting this stack (mac-/linux-/windows-). See README.md.
  eventhubs:
    container_name: "eventhubs-emulator"
    image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest"
    pull_policy: always
    volumes:
      - "./config/eventhub.Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
    ports:
      - "127.0.0.2:5672:5672"
      - "127.0.0.2:9092:9092"
      - "127.0.0.2:5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: ${ACCEPT_EULA}
    depends_on:
      - azurite
    networks:
      eh-emulator:
        aliases:
          - "eventhubs-emulator"

  azurite:
    container_name: "azurite"
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    pull_policy: always
    networks:
      eh-emulator:
        aliases:
          - "azurite"

networks:
  sb-emulator:
  eh-emulator:
